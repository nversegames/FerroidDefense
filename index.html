<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferroid Defense</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            user-select: none;
        }

        #gameContainer {
            position: relative;
            border: 3px solid #444;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0, 255, 150, 0.2);
        }

        canvas {
            display: block;
            background: #1a1a1a;
            cursor: pointer;
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #energyDisplay {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #00ff96;
            font-size: 26px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ff96;
            pointer-events: none;
        }

        #reactorHealth {
            position: absolute;
            top: 10px;
            left: 15px;
            color: #ff4444;
            font-size: 26px;
            font-weight: bold;
            text-shadow: 0 0 10px #ff4444;
            pointer-events: none;
        }

        #waveInfo {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffcc00;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 0 0 8px #ffcc00;
            pointer-events: none;
        }

        #towerPanel {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }

        .tower-btn {
            width: 70px;
            height: 70px;
            background: #2a2a2a;
            border: 2px solid #555;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .tower-btn:hover {
            background: #3a3a3a;
            border-color: #00ff96;
            box-shadow: 0 0 15px rgba(0, 255, 150, 0.3);
        }

        .tower-btn.selected {
            background: #1a3a2a;
            border-color: #00ff96;
            box-shadow: 0 0 20px rgba(0, 255, 150, 0.5);
        }

        .tower-btn .icon {
            font-size: 28px;
        }

        .tower-btn .cost {
            font-size: 14px;
            color: #00ff96;
        }

        .tower-btn .key {
            font-size: 11px;
            color: #888;
        }

        #startWaveBtn {
            position: absolute;
            bottom: 100px;
            right: 15px;
            padding: 15px 30px;
            background: #2a2a2a;
            border: 2px solid #ffcc00;
            border-radius: 8px;
            color: #ffcc00;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.2s;
            font-family: 'Courier New', monospace;
        }

        #startWaveBtn:hover {
            background: #3a3a00;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.4);
        }

        #startWaveBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .dialog-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            cursor: pointer;
        }

        .dialog-speaker {
            color: #00ff96;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 15px #00ff96;
        }

        .dialog-text {
            color: #fff;
            font-size: 20px;
            max-width: 600px;
            text-align: center;
            line-height: 1.5;
        }

        .dialog-hint {
            color: #888;
            font-size: 14px;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui">
            <div id="energyDisplay">⚡ 100</div>
            <div id="reactorHealth">❤️ 100</div>
            <div id="waveInfo">Волна: 0/0</div>

            <div id="towerPanel">
                <div class="tower-btn" data-tower="basic_gun" title="Пушка — 50⚡">
                    <span class="icon">🔫</span>
                    <span class="cost">50⚡</span>
                    <span class="key">[1]</span>
                </div>
                <div class="tower-btn" data-tower="slow_pad" title="Подушка — 25⚡">
                    <span class="icon">🧊</span>
                    <span class="cost">25⚡</span>
                    <span class="key">[2]</span>
                </div>
                <div class="tower-btn" data-tower="trap" title="Ловушка — 75⚡">
                    <span class="icon">💥</span>
                    <span class="cost">75⚡</span>
                    <span class="key">[3]</span>
                </div>
                <div class="tower-btn" data-tower="heavy_cannon" title="Тяжёлая пушка — 150⚡">
                    <span class="icon">🚀</span>
                    <span class="cost">150⚡</span>
                    <span class="key">[4]</span>
                </div>
            </div>

            <button id="startWaveBtn">▶ НАЧАТЬ ВОЛНУ</button>
        </div>
    </div>

    <!-- Подключение скриптов в правильном порядке -->
    <script src="js/config.js"></script>
    <script src="js/grid.js"></script>
    <script src="js/energy.js"></script>
    <script src="js/reactor.js"></script>
    <script src="js/towers.js"></script>
    <script src="js/enemies.js"></script>
    <script src="js/waves.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
