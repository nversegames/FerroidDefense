<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferroid Defense - Защита Башни</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            user-select: none;
            background: linear-gradient(135deg, #0d0d0d 0%, #1a1a2e 50%, #0d0d0d 100%);
        }

        #gameContainer {
            position: relative;
            border: 3px solid #444;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0, 255, 150, 0.2);
            width: 1200px;
            height: 700px;
        }

        canvas {
            display: block;
            background: #1a1a1a;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #energyDisplay, #reactorHealth, #waveInfo, #moneyDisplay {
            position: absolute;
            top: 10px;
            font-size: 26px;
            font-weight: bold;
            text-shadow: 0 0 10px currentColor;
            pointer-events: auto;
        }

        #energyDisplay { right: 15px; color: #00ff96; }
        #reactorHealth { left: 15px; color: #ff4444; }
        #waveInfo { left: 50%; transform: translateX(-50%); color: #ffcc00; font-size: 22px; }
        #moneyDisplay { left: 200px; color: #ffd700; }

        #ballPanel {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            pointer-events: auto;
            z-index: 100;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 10px;
            border: 2px solid #444;
        }

        .ball-btn {
            width: 60px;
            height: 60px;
            background: #2a2a2a;
            border: 2px solid #555;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            pointer-events: auto;
            position: relative;
            overflow: hidden;
        }

        .ball-btn img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .ball-btn:hover {
            background: #3a3a3a;
            border-color: #00ff96;
            box-shadow: 0 0 15px rgba(0, 255, 150, 0.3);
        }

        .ball-btn.selected {
            background: #1a3a2a;
            border-color: #00ff96;
            box-shadow: 0 0 20px rgba(0, 255, 150, 0.5);
            animation: pulse 1s infinite;
        }

        .ball-btn .energy-cost {
            font-size: 10px;
            color: #00ff96;
            pointer-events: none;
            position: absolute;
            bottom: 2px;
        }

        .ball-btn .key {
            font-size: 10px;
            color: #888;
            pointer-events: none;
            position: absolute;
            top: 2px;
            right: 5px;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        #modulePanel {
            position: absolute;
            top: 60px;
            right: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            pointer-events: auto;
            z-index: 100;
        }

        .module-btn {
            width: 50px;
            height: 50px;
            background: #2a2a2a;
            border: 2px solid #555;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            pointer-events: auto;
            position: relative;
            overflow: hidden;
        }

        .module-btn img {
            width: 35px;
            height: 35px;
            object-fit: contain;
        }

        .module-btn:hover {
            background: #3a3a3a;
            border-color: #00ff96;
            box-shadow: 0 0 15px rgba(0, 255, 150, 0.3);
        }

        .module-btn.selected {
            background: #1a3a2a;
            border-color: #00ff96;
        }

        .module-btn .cost {
            font-size: 10px;
            color: #00ff96;
            position: absolute;
            bottom: 2px;
        }

        #startWaveBtn {
            position: absolute;
            bottom: 100px;
            right: 15px;
            padding: 15px 30px;
            background: #2a2a2a;
            border: 2px solid #ffcc00;
            border-radius: 8px;
            color: #ffcc00;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.2s;
            font-family: 'Courier New', monospace;
            z-index: 100;
        }

        #startWaveBtn:hover {
            background: #3a3a00;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.4);
        }

        #startWaveBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        #menuBtn, #researchBtn, #captureBtn, #shopBtn, #saveBtn {
            position: absolute;
            top: 10px;
            padding: 10px 20px;
            background: #2a2a2a;
            border: 2px solid #00ff96;
            border-radius: 8px;
            color: #00ff96;
            font-size: 16px;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.2s;
            font-family: 'Courier New', monospace;
            z-index: 100;
        }

        #menuBtn { left: 350px; }
        #researchBtn { left: 450px; }
        #captureBtn { left: 550px; }
        #shopBtn { left: 650px; }
        #saveBtn { left: 750px; }

        #menuBtn:hover, #researchBtn:hover, #captureBtn:hover, #shopBtn:hover, #saveBtn:hover {
            background: #1a3a2a;
            box-shadow: 0 0 15px rgba(0, 255, 150, 0.3);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
        }

        .overlay .speaker {
            color: #00ff96;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 15px #00ff96;
        }

        .overlay .text {
            color: #fff;
            font-size: 20px;
            max-width: 600px;
            text-align: center;
            line-height: 1.5;
        }

        .overlay .hint {
            color: #888;
            font-size: 14px;
            margin-top: 30px;
        }

        .overlay .title {
            font-size: 40px;
            color: #ffcc00;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 0 0 20px #ffcc00;
        }

        .overlay .icon {
            font-size: 70px;
            margin-bottom: 15px;
        }

        /* Меню и магазин */
        .menu-container, .shop-container, .research-container, .capture-container, .save-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            pointer-events: auto;
        }

        .menu-content, .shop-content, .research-content, .capture-content, .save-content {
            text-align: center;
            color: white;
            width: 90%;
            height: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-y: auto;
            padding: 20px;
        }

        .menu-title {
            font-size: 48px;
            font-weight: bold;
            color: #00ff96;
            text-shadow: 0 0 30px #00ff96, 0 0 60px #00ff96;
            margin-bottom: 20px;
            animation: glow 2s infinite;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 30px #00ff96, 0 0 60px #00ff96; }
            50% { text-shadow: 0 0 50px #00ff96, 0 0 80px #00ff96, 0 0 100px #00ff96; }
        }

        .menu-subtitle {
            font-size: 20px;
            color: #ffcc00;
            margin-bottom: 40px;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
            margin: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            border: 2px solid #444;
        }

        .level-card {
            width: 120px;
            height: 120px;
            background: #2a2a2a;
            border: 3px solid #555;
            border-radius: 15px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .level-card img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
        }

        .level-card.locked {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(100%);
        }

        .level-card.unlocked:hover {
            background: #3a3a3a;
            border-color: #00ff96;
            box-shadow: 0 0 25px rgba(0, 255, 150, 0.5);
            transform: scale(1.1);
        }

        .level-card.completed {
            border-color: #00ff96;
            background: #1a3a2a;
        }

        .level-number {
            font-size: 28px;
            font-weight: bold;
            color: #ffcc00;
        }

        .level-name {
            font-size: 10px;
            color: #aaa;
            text-align: center;
            padding: 0 5px;
        }

        .stars {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 12px;
            color: #ffcc00;
        }

        .back-button, .shop-button, .research-button, .capture-button, .save-button {
            padding: 10px 20px;
            background: #2a2a2a;
            border: 2px solid #ff4444;
            border-radius: 8px;
            color: #ff4444;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
            transition: all 0.3s;
            pointer-events: auto;
        }

        .back-button:hover, .shop-button:hover, .research-button:hover, .capture-button:hover, .save-button:hover {
            background: #3a1a1a;
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.3);
        }

        .upgrade-item, .research-item, .captive-item, .save-item {
            background: #2a2a2a;
            border: 2px solid #555;
            border-radius: 10px;
            padding: 15px;
            margin: 10px;
            cursor: pointer;
            transition: all 0.3s;
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 80%;
        }

        .upgrade-item:hover, .research-item:hover, .captive-item:hover, .save-item:hover {
            border-color: #00ff96;
            box-shadow: 0 0 15px rgba(0, 255, 150, 0.3);
            background: #3a3a3a;
        }

        .upgrade-icon, .research-icon, .captive-icon, .save-icon {
            font-size: 30px;
            margin-right: 15px;
        }

        .upgrade-info, .research-info, .captive-info, .save-info {
            flex: 1;
            text-align: left;
        }

        .upgrade-name, .research-name, .captive-name, .save-name {
            font-weight: bold;
            color: #ffcc00;
            margin-bottom: 5px;
        }

        .upgrade-desc, .research-desc, .captive-desc, .save-desc {
            color: #aaa;
            font-size: 14px;
        }

        .upgrade-cost, .research-cost, .captive-status, .save-status {
            color: #00ff96;
            font-weight: bold;
            margin-left: 15px;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #2a2a2a;
            border: 3px solid #ffcc00;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10000;
            animation: slideIn 0.5s ease-out;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.5);
            pointer-events: auto;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }

        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #00ff96;
            border-radius: 5px;
            padding: 10px;
            color: #fff;
            font-size: 14px;
            pointer-events: none;
            z-index: 3000;
            max-width: 200px;
        }

        /* Стили для видео и спрайтов */
        .video-container {
            width: 100%;
            height: 300px;
            background: #000;
            border: 2px solid #444;
            border-radius: 10px;
            margin: 10px 0;
            overflow: hidden;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .character-portrait {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #00ff96;
            overflow: hidden;
            margin: 10px;
            background: #2a2a2a;
        }

        .character-portrait img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .enemy-sprite {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            overflow: hidden;
            margin: 5px;
            background: #2a2a2a;
            display: inline-block;
        }

        .enemy-sprite img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .save-slot {
            background: #2a2a2a;
            border: 2px solid #555;
            border-radius: 10px;
            padding: 20px;
            margin: 10px;
            cursor: pointer;
            transition: all 0.3s;
            width: 80%;
            text-align: left;
        }

        .save-slot:hover {
            border-color: #00ff96;
            background: #3a3a3a;
        }

        .save-slot .slot-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .save-slot .slot-title {
            color: #ffcc00;
            font-weight: bold;
            font-size: 18px;
        }

        .save-slot .slot-date {
            color: #888;
            font-size: 12px;
        }

        .save-slot .slot-info {
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <div id="energyDisplay">⚡ 100</div>
            <div id="reactorHealth">❤️ 100</div>
            <div id="waveInfo">Волна: 0/0</div>
            <div id="moneyDisplay">💰 0</div>

            <button id="menuBtn">🏠 Меню</button>
            <button id="researchBtn">🔬 Исследования</button>
            <button id="captureBtn">🔒 Пленные</button>
            <button id="shopBtn">🛒 Магазин</button>
            <button id="saveBtn">💾 Сохранить</button>

            <div id="ballPanel">
                <div class="ball-btn" data-ball="fire" title="Огненный шар">
                    <img src="sprites/balls/fire_ball.png" alt="Огонь">
                    <span class="energy-cost">10⚡</span>
                    <span class="key">[1]</span>
                </div>
                <div class="ball-btn" data-ball="ice" title="Ледяной шар">
                    <img src="sprites/balls/ice_ball.png" alt="Лёд">
                    <span class="energy-cost">15⚡</span>
                    <span class="key">[2]</span>
                </div>
                <div class="ball-btn" data-ball="electric" title="Электрический шар">
                    <img src="sprites/balls/electric_ball.png" alt="Электричество">
                    <span class="energy-cost">20⚡</span>
                    <span class="key">[3]</span>
                </div>
                <div class="ball-btn" data-ball="explosive" title="Взрывной шар">
                    <img src="sprites/balls/explosive_ball.png" alt="Взрыв">
                    <span class="energy-cost">25⚡</span>
                    <span class="key">[4]</span>
                </div>
                <div class="ball-btn" data-ball="acid" title="Кислотный шар">
                    <img src="sprites/balls/acid_ball.png" alt="Кислота">
                    <span class="energy-cost">30⚡</span>
                    <span class="key">[5]</span>
                </div>
                <div class="ball-btn" data-ball="net" title="Сетка для захвата">
                    <img src="sprites/balls/net_ball.png" alt="Сетка">
                    <span class="energy-cost">40⚡</span>
                    <span class="key">[6]</span>
                </div>
            </div>

            <div id="modulePanel">
                <div class="module-btn" data-module="pad" title="Подушка - замедляет врагов">
                    <img src="sprites/modules/pad.png" alt="Подушка">
                    <span class="cost">25⚡</span>
                </div>
                <div class="module-btn" data-module="trap" title="Ловушка - одноразовый урон">
                    <img src="sprites/modules/trap.png" alt="Ловушка">
                    <span class="cost">75⚡</span>
                </div>
                <div class="module-btn" data-module="generator" title="Генератор - пассивная энергия">
                    <img src="sprites/modules/generator.png" alt="Генератор">
                    <span class="cost">50⚡</span>
                </div>
                <div class="module-btn" data-module="amplifier" title="Усилитель - увеличивает урон">
                    <img src="sprites/modules/amplifier.png" alt="Усилитель">
                    <span class="cost">100⚡</span>
                </div>
                <div class="module-btn" data-module="magnet" title="Магнит - притягивает врагов">
                    <img src="sprites/modules/magnet.png" alt="Магнит">
                    <span class="cost">80⚡</span>
                </div>
            </div>

            <button id="startWaveBtn">▶ НАЧАТЬ ВОЛНУ</button>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="ui.js"></script>
    <script src="game.js"></script>
</body>
</html>
