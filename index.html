<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferroid Defense - Защита Башни</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            user-select: none;
            background: linear-gradient(135deg, #0d0d0d 0%, #1a1a2e 50%, #0d0d0d 100%);
        }

        #gameContainer {
            position: relative;
            border: 3px solid #444;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0, 255, 150, 0.2);
        }

        canvas {
            display: block;
            background: #1a1a1a;
            cursor: pointer;
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #energyDisplay, #reactorHealth, #waveInfo {
            position: absolute;
            top: 10px;
            font-size: 26px;
            font-weight: bold;
            text-shadow: 0 0 10px currentColor;
        }

        #energyDisplay { right: 15px; color: #00ff96; }
        #reactorHealth { left: 15px; color: #ff4444; }
        #waveInfo { left: 50%; transform: translateX(-50%); color: #ffcc00; font-size: 22px; }

        #towerPanel {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            pointer-events: auto;
            z-index: 100;
        }

        .tower-btn {
            width: 70px;
            height: 70px;
            background: #2a2a2a;
            border: 2px solid #555;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            pointer-events: auto;
            position: relative;
        }

        .tower-btn:hover {
            background: #3a3a3a;
            border-color: #00ff96;
            box-shadow: 0 0 15px rgba(0, 255, 150, 0.3);
        }

        .tower-btn.selected {
            background: #1a3a2a;
            border-color: #00ff96;
            box-shadow: 0 0 20px rgba(0, 255, 150, 0.5);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .tower-btn .icon { font-size: 28px; pointer-events: none; }
        .tower-btn .cost { font-size: 14px; color: #00ff96; pointer-events: none; }
        .tower-btn .key { font-size: 11px; color: #888; pointer-events: none; position: absolute; top: 2px; right: 5px; }

        #startWaveBtn {
            position: absolute;
            bottom: 100px;
            right: 15px;
            padding: 15px 30px;
            background: #2a2a2a;
            border: 2px solid #ffcc00;
            border-radius: 8px;
            color: #ffcc00;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.2s;
            font-family: 'Courier New', monospace;
            z-index: 100;
        }

        #startWaveBtn:hover {
            background: #3a3a00;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.4);
        }

        #startWaveBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
        }

        .overlay .speaker {
            color: #00ff96;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 15px #00ff96;
        }

        .overlay .text {
            color: #fff;
            font-size: 20px;
            max-width: 600px;
            text-align: center;
            line-height: 1.5;
        }

        .overlay .hint {
            color: #888;
            font-size: 14px;
            margin-top: 30px;
        }

        .overlay .title {
            font-size: 40px;
            color: #ffcc00;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 0 0 20px #ffcc00;
        }

        .overlay .icon {
            font-size: 70px;
            margin-bottom: 15px;
        }

        /* Новые стили для меню */
        .menu-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .menu-content {
            text-align: center;
            color: white;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .menu-title {
            font-size: 48px;
            font-weight: bold;
            color: #00ff96;
            text-shadow: 0 0 30px #00ff96, 0 0 60px #00ff96;
            margin-bottom: 20px;
            animation: glow 2s infinite;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 30px #00ff96, 0 0 60px #00ff96; }
            50% { text-shadow: 0 0 50px #00ff96, 0 0 80px #00ff96, 0 0 100px #00ff96; }
        }

        .menu-subtitle {
            font-size: 20px;
            color: #ffcc00;
            margin-bottom: 40px;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
            margin: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            border: 2px solid #444;
        }

        .level-card {
            width: 120px;
            height: 120px;
            background: #2a2a2a;
            border: 3px solid #555;
            border-radius: 15px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            position: relative;
        }

        .level-card.locked {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(100%);
        }

        .level-card.unlocked:hover {
            background: #3a3a3a;
            border-color: #00ff96;
            box-shadow: 0 0 25px rgba(0, 255, 150, 0.5);
            transform: scale(1.1);
        }

        .level-card.completed {
            border-color: #00ff96;
            background: #1a3a2a;
        }

        .level-number {
            font-size: 28px;
            font-weight: bold;
            color: #ffcc00;
        }

        .level-icon {
            font-size: 35px;
            margin: 10px 0;
        }

        .level-name {
            font-size: 10px;
            color: #aaa;
            text-align: center;
            padding: 0 5px;
        }

        .stars {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 12px;
            color: #ffcc00;
        }

        .achievement-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 24px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .back-button {
            padding: 10px 20px;
            background: #2a2a2a;
            border: 2px solid #ff4444;
            border-radius: 8px;
            color: #ff4444;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
            transition: all 0.3s;
        }

        .back-button:hover {
            background: #3a1a1a;
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.3);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <div id="energyDisplay">⚡ 100</div>
            <div id="reactorHealth">❤️ 100</div>
            <div id="waveInfo">Волна: 0/0</div>

            <div id="towerPanel">
                <div class="tower-btn" data-tower="basic_gun">
                    <span class="icon">🔫</span>
                    <span class="cost">50⚡</span>
                    <span class="key">[1]</span>
                </div>
                <div class="tower-btn" data-tower="slow_pad">
                    <span class="icon">🧊</span>
                    <span class="cost">25⚡</span>
                    <span class="key">[2]</span>
                </div>
                <div class="tower-btn" data-tower="trap">
                    <span class="icon">💥</span>
                    <span class="cost">75⚡</span>
                    <span class="key">[3]</span>
                </div>
                <div class="tower-btn" data-tower="heavy_cannon">
                    <span class="icon">🚀</span>
                    <span class="cost">150⚡</span>
                    <span class="key">[4]</span>
                </div>
            </div>

            <button id="startWaveBtn">▶ НАЧАТЬ ВОЛНУ</button>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="ui.js"></script>
    <script src="game.js"></script>
</body>
</html>
