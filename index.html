<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferroid Defense</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            user-select: none;
        }

        #gameContainer {
            position: relative;
            border: 3px solid #444;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0, 255, 150, 0.2);
        }

        canvas {
            display: block;
            background: #1a1a1a;
            cursor: pointer;
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #energyDisplay, #reactorHealth, #waveInfo {
            position: absolute;
            top: 10px;
            font-size: 26px;
            font-weight: bold;
            text-shadow: 0 0 10px currentColor;
        }

        #energyDisplay { right: 15px; color: #00ff96; }
        #reactorHealth { left: 15px; color: #ff4444; }
        #waveInfo { left: 50%; transform: translateX(-50%); color: #ffcc00; font-size: 22px; }

        #towerPanel {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            pointer-events: auto;
            z-index: 100;
        }

        .tower-btn {
            width: 70px;
            height: 70px;
            background: #2a2a2a;
            border: 2px solid #555;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            pointer-events: auto;
        }

        .tower-btn:hover {
            background: #3a3a3a;
            border-color: #00ff96;
            box-shadow: 0 0 15px rgba(0, 255, 150, 0.3);
        }

        .tower-btn.selected {
            background: #1a3a2a;
            border-color: #00ff96;
            box-shadow: 0 0 20px rgba(0, 255, 150, 0.5);
        }

        .tower-btn .icon { font-size: 28px; pointer-events: none; }
        .tower-btn .cost { font-size: 14px; color: #00ff96; pointer-events: none; }
        .tower-btn .key { font-size: 11px; color: #888; pointer-events: none; }

        #startWaveBtn {
            position: absolute;
            bottom: 100px;
            right: 15px;
            padding: 15px 30px;
            background: #2a2a2a;
            border: 2px solid #ffcc00;
            border-radius: 8px;
            color: #ffcc00;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.2s;
            font-family: 'Courier New', monospace;
            z-index: 100;
        }

        #startWaveBtn:hover {
            background: #3a3a00;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.4);
        }

        #startWaveBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
        }

        .overlay .speaker {
            color: #00ff96;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 15px #00ff96;
        }

        .overlay .text {
            color: #fff;
            font-size: 20px;
            max-width: 600px;
            text-align: center;
            line-height: 1.5;
        }

        .overlay .hint {
            color: #888;
            font-size: 14px;
            margin-top: 30px;
        }

        .overlay .title {
            font-size: 40px;
            color: #ffcc00;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 0 0 20px #ffcc00;
        }

        .overlay .icon {
            font-size: 70px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <div id="energyDisplay">⚡ 100</div>
            <div id="reactorHealth">❤️ 100</div>
            <div id="waveInfo">Волна: 0/0</div>

            <div id="towerPanel">
                <div class="tower-btn" data-tower="basic_gun">
                    <span class="icon">🔫</span>
                    <span class="cost">50⚡</span>
                    <span class="key">[1]</span>
                </div>
                <div class="tower-btn" data-tower="slow_pad">
                    <span class="icon">🧊</span>
                    <span class="cost">25⚡</span>
                    <span class="key">[2]</span>
                </div>
                <div class="tower-btn" data-tower="trap">
                    <span class="icon">💥</span>
                    <span class="cost">75⚡</span>
                    <span class="key">[3]</span>
                </div>
                <div class="tower-btn" data-tower="heavy_cannon">
                    <span class="icon">🚀</span>
                    <span class="cost">150⚡</span>
                    <span class="key">[4]</span>
                </div>
            </div>

            <button id="startWaveBtn">▶ НАЧАТЬ ВОЛНУ</button>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="game.js"></script>
    <script src="ui.js"></script>
</body>
</html>
